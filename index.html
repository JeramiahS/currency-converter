<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CurrencyConverter</title>
  <link rel="stylesheet" href="index.css">
  <script src="fetch-currencies.js"></script>
</head>
<body>
    <div class="title">
      <h1>Currency Converter</h1>
      <img class="app-icon" src="CurrencyConverterIcon.png">
    </div>
    <form>
      <div class="input-form">
        <label for="amount-input">Amount:</label>
        <input type="number" name="amount" id="amount-input" required>
        <br>
        <label for="select-from-menu">Convert From:</label>
        <select name="from" id="select-from-menu" required>
          <option value="">Select a currency</option>
        </select>
        <br>
        <label for="select-to-menu">Convert To:</label>
        <select name="to" id="select-to-menu" required>
          <option value="">Select a currency</option>
        </select>
        <br>
        <button type="button" class="form-button" id="convert-button">Convert</button>
        <script src="fetch-converison-result.js"></script>
      </div>
    </form>
    <div id="result-display-area" hidden>
      <p class="result-text">Conversion result will be here</p>
    </div>
    <footer>
      <p>&copy; 2026 Jeramiah Sanchez. All rights reserved.</p>
    </footer>
</body>
</html>
